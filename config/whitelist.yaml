# 文件访问白名单 - 每个助手只能访问指定目录
assistants:
  chat:
    allowed_paths:
      - "~/ai-assistant-system/data/chat"
      - "~/ai-assistant-system/assistants/chat-assistant"
    denied_paths:
      - "~/ai-assistant-system/data/office"
      - "~/ai-assistant-system/data/dev"

  office:
    allowed_paths:
      - "~/ai-assistant-system/data/office"
      - "~/ai-assistant-system/assistants/office-assistant"
    denied_paths:
      - "~/ai-assistant-system/data/chat"
      - "~/ai-assistant-system/data/dev"

  file:
    allowed_paths:
      - "."          # ai-assistant-system 项目目录
      - ".."         # 项目上一级目录（如 /Volumes/BR256G/）
    denied_paths:
      - "/etc"
      - "/var"
      - "/System"
      - "/Library"
      - "~/.ssh"
      - "~/.config"
      - "~/.gnupg"
      - "~/.aws"
      - "~/.kube"

  dev:
    allowed_paths:
      - "~/ai-assistant-system/data/dev"
      - "~/ai-assistant-system/assistants/dev-assistant"
    denied_paths:
      - "~/ai-assistant-system/data/chat"
      - "~/ai-assistant-system/data/office"

