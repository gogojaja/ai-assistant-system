# 文件访问白名单 - 每个助手只能访问指定目录
assistants:
  chat:
    allowed_paths:
      - "~/ai-assistant-system/data/chat"
      - "~/ai-assistant-system/assistants/chat-assistant"
    denied_paths:
      - "~/ai-assistant-system/data/office"

  office:
    allowed_paths:
      - "~/ai-assistant-system/data/office"
      - "~/ai-assistant-system/assistants/office-assistant"
    denied_paths:
      - "~/ai-assistant-system/data/chat"

